# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oidc-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The OIDC auth module as a droppable busbar plugin — a cdylib exporting the auth C ABI. Drop it in the plugins folder and add `oidc` to auth.chain with auth.modules.oidc.config."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests / e2e test can exercise it as a normal crate too

[dependencies]
# INTERIM: busbarAI isn't public yet, so these are local path dependencies into a sibling checkout of
# the monorepo. Once busbarAI ships publicly these should become git (pinned rev/tag) or crates.io
# dependencies instead — same pattern being applied to webrequest-hook's busbar-plugin-sdk dependency.
busbar-api = { path = "../busbarAI/crates/api" }
busbar-plugin-sdk = { path = "../busbarAI/crates/plugin-sdk" }
busbar-auth-oidc = { path = "../busbarAI/crates/auth-oidc" }
serde_json = "1"

[dev-dependencies]
# INTERIM local path deps, same rationale as above — these are dev-only. The end-to-end test loads the
# built cdylib over the real loader ABI seam, mints a real ES256 JWT, and serves a real JWKS document
# over a real local TLS listener, so `busbar-auth-oidc`'s own `ReqwestFetcher` does a genuine HTTPS
# fetch+verify rather than a stub. Same rustls/rcgen/ring versions the monorepo already pins for this
# exact test (`crates/plugin-loader`'s dev-dependencies).
busbar-plugin-loader = { path = "../busbarAI/crates/plugin-loader" }
busbar-plugin-abi = { path = "../busbarAI/crates/plugin-abi" }
ring = "0.17"
base64 = "0.22"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
